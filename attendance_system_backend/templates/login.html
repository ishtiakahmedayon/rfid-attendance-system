<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RFID Attendance Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand-mark">ID</div>
      <h2>RFID Attendance System</h2>
      <p class="hint">Sign in to view attendance records</p>

      {% if error %}<p class="error">{{ error }}</p>{% endif %}

      <form method="post" action="{{ url_for('ui.login') }}">
        <label>Username</label>
        <input type="text" name="username" placeholder="Teacher ID or Student ID" required autofocus />
        <label>Password</label>
        <input type="password" name="password" placeholder="Password / Student name" required />
        <button type="submit">Sign In</button>
      </form>

      <p class="hint" style="margin-top:4px;">
        Teachers: teacher ID + password &nbsp;•&nbsp; Students: student ID + full name
      </p>
    </div>
  </div>
</body>
</html>
