<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RFID Attendance Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; }
    .card { max-width: 420px; margin: 60px auto; background: white; padding: 24px; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: 0; border-radius: 4px; }
    .hint { color: #374151; font-size: 14px; }
    .error { color: #b91c1c; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>RFID Attendance System</h2>
    <p class="hint">Teacher: use teacher credentials. Student: use student_id + RFID UID.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('ui.login') }}">
      <label>Username</label>
      <input type="text" name="username" required />
      <label>Password</label>
      <input type="password" name="password" required />
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
